name: Coverage

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Verify coverage documentation is up to date
        run: ./gradlew :tools:coverage:verifyCoverage --console=plain
