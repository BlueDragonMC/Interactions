[versions]
# @keep Used by the module build scripts for the Java toolchain
jvm = "25"
adventure = "5.2.0"
kotlin = "2.4.21"
minestom = "26_3-SNAPSHOT"
dokka = "2.3.0"

[libraries]
minestom = { group = "net.minestom", name = "minestom", version.ref = "minestom" }
minestom-testing = { group = "net.minestom", name = "testing", version.ref = "minestom" }
adventure-api = { group = "net.kyori", name = "adventure-api", version.ref = "adventure" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka-javadoc", version.ref = "dokka" }